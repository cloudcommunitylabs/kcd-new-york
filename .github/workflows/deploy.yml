name: Deploy 2026 archive to Cloudflare Pages

# This branch is the frozen KCD New York 2026 site (2026.kcdnewyork.com).
# Pushes to `2026` become the production deployment of the kcd-newyork-2026
# Pages project; pull requests against `2026` get a preview alias.

on:
  push:
    branches:
      - "2026"
  pull_request:
    branches:
      - "2026"
  workflow_dispatch:

env:
  CLOUDFLARE_PAGES_PROJECT: kcd-newyork-2026
  # wrangler treats the project's production branch ("main") as production.
  # Pushes to this branch are deployed under that name; PRs use their own alias.
  DEPLOY_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build Gatsby site
        run: yarn build
        env:
          GATSBY_SITE_URL: https://2026.kcdnewyork.com

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ env.DEPLOY_BRANCH }}

      - name: Comment on PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PROJECT_NAME: ${{ env.CLOUDFLARE_PAGES_PROJECT }}
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const commitSha = context.payload.pull_request.head.sha.substring(0, 8);
            const prNumber = context.payload.pull_request.number;
            const projectName = process.env.PROJECT_NAME;
            const branchAlias = branchName.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/^-+|-+$/g, '').substring(0, 28).replace(/-+$/g, '');
            const previewUrl = `https://${branchAlias}.${projectName}.pages.dev`;
            const body = `## 🚀 2026 archive preview\n\n**Preview URL:** ${previewUrl}\n\n---\n*Deployment: ${commitSha} | Branch: ${branchName}*`;
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('2026 archive preview'));
            if (botComment) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: botComment.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body });
            }
